<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>月次面談アジェンダ管理ツール</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f7f5;
      color: #24332c;
      font-family: "Meiryo", "Yu Gothic", system-ui, sans-serif;
    }
    main {
      width: min(720px, calc(100% - 32px));
      border: 1px solid #dbe4df;
      border-radius: 8px;
      padding: 28px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(23, 39, 31, 0.08);
    }
    p {
      line-height: 1.8;
    }
    code {
      border-radius: 4px;
      padding: 2px 5px;
      background: #edf4f0;
    }
    footer {
      margin-top: 24px;
      color: #64756c;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>Supabase正本版へ移行済みです</h1>
    <p>
      このリポジトリは、静的HTML版ではなく、Vercel + Supabaseで動作するNext.jsアプリとして再構築されています。
    </p>
    <p>
      ローカルで確認する場合は、Supabase環境変数を設定したうえで <code>npm.cmd run dev</code> を実行してください。
      セットアップ手順は <code>docs/supabase-setup.md</code> を参照してください。
    </p>
    <footer>松本会計事務所 / 最終更新日: 2026-06-19 / R003</footer>
  </main>
</body>
</html>
